name: Basic CI/CD Workflow

on:
  push:
    branches:
      - develop
      - main
      - ci/**
      - feature/**
      - fix/**
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  ci-check:
    name: CI - Validate Source Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Show current branch and commit
        run: |
          echo "Current branch:"
          git branch -a
          echo "Current commit:"
          git log --oneline -5

      - name: Show project structure
        run: |
          echo "Project structure:"
          pwd
          find . -maxdepth 4 -type f

      - name: Validate required files
        run: |
          echo "Checking required files..."

          if [ ! -f "web-demo/login.html" ]; then
            echo "Missing file: web-demo/login.html"
            exit 1
          fi

          if [ ! -f "web-demo/profile.html" ]; then
            echo "Missing file: web-demo/profile.html"
            exit 1
          fi

          if [ ! -f "web-demo/navigation.md" ]; then
            echo "Missing file: web-demo/navigation.md"
            exit 1
          fi

          if [ ! -f "TEST_REPORT.md" ]; then
            echo "Missing file: TEST_REPORT.md"
            exit 1
          fi

          if [ ! -f "RELEASE_NOTE_v1.0.md" ]; then
            echo "Missing file: RELEASE_NOTE_v1.0.md"
            exit 1
          fi

          echo "All required files exist."

      - name: Validate Login Page
        run: |
          grep -qi "<form" web-demo/login.html
          grep -qi "username" web-demo/login.html
          grep -qi "password" web-demo/login.html
          grep -qi "login" web-demo/login.html
          echo "Login page validation passed."

      - name: Validate Profile Page
        run: |
          grep -qi "profile" web-demo/profile.html
          grep -qi "email" web-demo/profile.html
          grep -qi "role" web-demo/profile.html
          echo "Profile page validation passed."

      - name: Validate Documentation
        run: |
          grep -qi "navigation" web-demo/navigation.md
          grep -qi "TEST REPORT" TEST_REPORT.md
          grep -qi "RELEASE NOTE v1.0" RELEASE_NOTE_v1.0.md
          echo "Documentation validation passed."

  cd-simulation:
    name: CD - Deployment Simulation
    runs-on: ubuntu-latest
    needs: ci-check

    steps:
      - name: Simulate deployment
        run: |
          echo "Static web demo deployment simulation started."
          echo "Build completed successfully."
          echo "Deployment simulation completed successfully."