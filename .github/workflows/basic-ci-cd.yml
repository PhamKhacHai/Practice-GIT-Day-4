name: Basic CI/CD Workflow

on:
  push:
    branches:
      - main
      - develop
      - ci/**
      - feature/**
      - fix/**

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  ci-check:
    name: CI - Validate Source Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Show project structure
        run: |
          echo "Current directory:"
          pwd

          echo "Project files:"
          find . -maxdepth 4 -type f

      - name: Validate required web-demo files
        run: |
          echo "Checking required web-demo files..."

          test -f web-demo/login.html
          test -f web-demo/profile.html
          test -f web-demo/navigation.md

          echo "Required web-demo files exist."

      - name: Validate report files
        run: |
          echo "Checking report files..."

          if [ -f TEST_REPORT.md ]; then
            echo "Found TEST_REPORT.md in root folder."
          elif [ -f web-demo/TEST_REPORT.md ]; then
            echo "Found TEST_REPORT.md in web-demo folder."
          else
            echo "Missing TEST_REPORT.md"
            exit 1
          fi

          if [ -f RELEASE_NOTE_v1.0.md ]; then
            echo "Found RELEASE_NOTE_v1.0.md in root folder."
          elif [ -f web-demo/RELEASE_NOTE_v1.0.md ]; then
            echo "Found RELEASE_NOTE_v1.0.md in web-demo folder."
          else
            echo "Missing RELEASE_NOTE_v1.0.md"
            exit 1
          fi

          echo "Report files exist."

      - name: Validate Login Page
        run: |
          echo "Checking login page..."

          grep -qi "<html" web-demo/login.html
          grep -qi "login" web-demo/login.html
          grep -qi "username" web-demo/login.html
          grep -qi "password" web-demo/login.html

          echo "Login page validation passed."

      - name: Validate Profile Page
        run: |
          echo "Checking profile page..."

          grep -qi "<html" web-demo/profile.html
          grep -qi "profile" web-demo/profile.html
          grep -qi "email" web-demo/profile.html

          echo "Profile page validation passed."

      - name: Validate Navigation Document
        run: |
          echo "Checking navigation document..."

          grep -qi "navigation" web-demo/navigation.md

          echo "Navigation document validation passed."

  cd-simulation:
    name: CD - Deployment Simulation
    runs-on: ubuntu-latest
    needs: ci-check

    steps:
      - name: Simulate deployment
        run: |
          echo "Starting deployment simulation..."
          echo "Build completed successfully."
          echo "Deployment simulation completed successfully."